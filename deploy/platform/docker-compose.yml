version: '3.8'

# 本地开发/测试用 docker-compose (Platform + PostgreSQL)
# 生产部署请使用 deploy/docker-compose.yml

services:
  platform:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__PlatformDb=Host=db;Database=MinGoQap;Username=postgres;Password=postgres;Port=5432
      - Authentication__Type=None
      - Heartbeat__TimeoutWarningSeconds=60
      - Heartbeat__TimeoutOfflineSeconds=90
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MinGoQap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
