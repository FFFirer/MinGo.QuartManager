# =============================================================================
# MinGo.QuartManager — Nginx 反向代理配置
# 部署于 Debian 12, 作为 Platform (.NET 10) 的前端代理
# =============================================================================

# 上游: Platform 容器
upstream platform_backend {
    server platform:80;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;

    # 健康检查端点直接响应
    location /healthz {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # 其他 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务 (SSL 终结)
server {
    listen 443 ssl http2;
    server_name _;

    # SSL 证书 (挂载自 ./nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL 协议和加密配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ========================================================================
    # API 代理 — 请求转发到 Platform
    # ========================================================================
    location /api/ {
        proxy_pass http://platform_backend;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 禁用缓存 (API 响应)
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ========================================================================
    # SPA 前端 — 所有非 API 路径转发到 Platform (由 MapFallbackToFile 处理)
    # ========================================================================
    location / {
        proxy_pass http://platform_backend;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA 缓存策略: HTML 不缓存, 静态资源缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
