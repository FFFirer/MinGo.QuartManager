# =============================================================================
# MinGo.QuartManager 生产部署配置
# 目标服务器: Debian 12
# 使用: docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Platform — .NET 10 Web API (包含 React UI wwwroot)
  # ---------------------------------------------------------------------------
  platform:
    image: ${REGISTRY:?REGISTRY not set}/${IMAGE_NAME:-1mingo/quartmanager}:${IMAGE_TAG:-latest}
    container_name: quartmanager-platform
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # ASP.NET Core 运行时
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true

      # 数据库连接 (外部 PostgreSQL)
      - ConnectionStrings__PlatformDb=${DB_CONNECTION_STRING:?DB_CONNECTION_STRING not set}

      # 认证 (生产环境需设置为 JWT 或 OIDC)
      - Authentication__Type=${AUTH_TYPE:-None}

      # Heartbeat 超时设置
      - Heartbeat__TimeoutWarningSeconds=${HEARTBEAT_WARNING:-60}
      - Heartbeat__TimeoutOfflineSeconds=${HEARTBEAT_OFFLINE:-90}

      # OpenTelemetry (可选，配置后启用 OTLP 导出)
      - OpenTelemetry__ServiceName=MinGo.Qap.Platform
      - OpenTelemetry__OtlpEndpoint=${OTEL_OTLP_ENDPOINT:-}

    healthcheck:
      test: ["CMD", "dotnet", "MinGo.Qap.Platform.dll", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qap-network

  # ---------------------------------------------------------------------------
  # Nginx — 反向代理 + SSL 终结
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: quartmanager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      platform:
        condition: service_started
    networks:
      - qap-network

networks:
  qap-network:
    driver: bridge
