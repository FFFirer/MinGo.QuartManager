# =============================================================================
# MinGo.QuartManager NuGet Publish Pipeline
#
# Triggers:
#   - release (published):  Pack + push NuGet packages
#                           Stable: tag = v1.2.3 → 1.2.3
#                           Prerelease: tag = v1.2.3-beta.1 → 1.2.3-beta.1
#   - workflow_dispatch:    Auto-increment dev version from version.txt
#                           e.g. 1.1.0-dev.42 (build number auto-appended)
# =============================================================================
name: Publish NuGet

on:
  release:
    types: [ published ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0'

jobs:
  publish-nuget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # -------------------------------------------------------------------------
      # Version computation:
      #   release event  → strip tag prefix (v1.2.3 → 1.2.3, v1.2.3-beta.1 → 1.2.3-beta.1)
      #   manual trigger → read version.txt, append -dev.{run_number}
      # -------------------------------------------------------------------------
      - name: Compute version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            echo "Mode: release → ${VERSION}"
          else
            BASE_VERSION=$(cat version.txt | tr -d '[:space:]')
            VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
            echo "Mode: dev build → ${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Pack NuGet packages
        run: |
          dotnet pack src/MinGo.Qap.Shared/MinGo.Qap.Shared.csproj \
            -c Release \
            -p:PackageVersion=${{ env.VERSION }} \
            -o ./nupkg

          dotnet pack src/MinGo.Qap.Agent/MinGo.Qap.Agent.csproj \
            -c Release \
            -p:PackageVersion=${{ env.VERSION }} \
            -o ./nupkg

      - name: Push NuGet package
        env:
          NUGET_SERVER_URL: ${{ vars.NUGET_SERVER_URL }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source ${{ env.NUGET_SERVER_URL }} \
            --api-key ${{ env.NUGET_API_KEY }} \
            --skip-duplicate
