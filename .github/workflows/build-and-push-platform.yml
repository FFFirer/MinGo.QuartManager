# =============================================================================
# MinGo.QuartManager Platform Docker Image Build & Push Pipeline
#
# Triggers:
#   - workflow_dispatch:    Build + push Docker image (manual)
# =============================================================================
name: Build and Push Platform Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        type: choice
        options:
          - staging
          - production
        default: staging
      version:
        description: 'Image version tag (optional, auto-generated if empty)'
        type: string
        required: false

env:
  CONTAINER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  CONTAINER_REGISTRY_USERNAME: ${{ vars.DOCKER_USERNAME }}
  CONTAINER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: mingogo/quartmanager-platform

jobs:
  # ===========================================================================
  # Job 1: Build Docker image and push to registry
  # ===========================================================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD }}

      - name: Extract version from tag
        id: extract_version
        run: |
          if [ "${{ inputs.version }}" != "" ]; then
            VERSION="${{ inputs.version }}"
          else
            COMMIT_SHA=$(git rev-parse --short HEAD)
            TIMESTAMP=$(date +"%Y%m%d%H%M%S")
            VERSION="dev-${COMMIT_SHA}-${TIMESTAMP}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Extracted version: ${VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest