# =============================================================================
# MinGo.QuartManager Platform Docker Image Build & Push Pipeline
#
# Triggers:
#   - release (published):  Build + push Docker image
#                           Stable: tag = v1.2.3 → tags: 1.2.3, latest
#                           Prerelease: tag = v1.2.3-beta.1 → tag: 1.2.3-beta.1
#   - workflow_dispatch:    Auto-increment dev version from platform-version.txt
#                           e.g. 1.1.0-build.42 (build number auto-appended)
#
# Version independence:
#   Platform uses platform-version.txt (independent of NuGet's version.txt)
#   allowing minor version differences between the two artifacts.
# =============================================================================
name: Build and Push Platform Image

on:
  release:
    types: [ published ]
  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  CONTAINER_REGISTRY_USERNAME: ${{ vars.DOCKER_USERNAME }}
  CONTAINER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_NAME: mingo/quartzmanager

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD }}

      # -------------------------------------------------------------------------
      # Version computation:
      #   release event  → strip tag prefix (v1.2.3 → 1.2.3)
      #   manual trigger → read platform-version.txt, append -build.{run_number}
      # Prerelease detection:
      #   release event  → github.event.release.prerelease
      #   manual trigger → always treated as prerelease (dev build)
      # Tag strategy:
      #   stable     → {version} + latest
      #   prerelease → {version}-build.{run_number} (no latest tag)
      # -------------------------------------------------------------------------
      - name: Compute version and tags
        id: version
        run: |
          TAGS="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:placeholder"

          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
            echo "Mode: release → ${VERSION} (prerelease=${IS_PRERELEASE})"
          else
            BASE_VERSION=$(cat platform-version.txt | tr -d '[:space:]')
            VERSION="${BASE_VERSION}-build.${GITHUB_RUN_NUMBER}"
            IS_PRERELEASE="true"
            echo "Mode: dev build → ${VERSION}"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_ENV

          # Build tag list
          TAGS="${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          if [ "${IS_PRERELEASE}" != "true" ]; then
            TAGS="${TAGS},${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "TAGS=${TAGS}" >> $GITHUB_ENV
          echo "Computed tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.TAGS }}
