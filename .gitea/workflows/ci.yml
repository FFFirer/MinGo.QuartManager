name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/MinGo.Qap.Platform/MinGo.Qap.Platform.csproj

      - name: Build
        run: dotnet build src/MinGo.Qap.Platform/MinGo.Qap.Platform.csproj --no-restore

      - name: Run tests
        run: dotnet test src/MinGo.Qap.Platform/MinGo.Qap.Platform.csproj --no-build --verbosity normal