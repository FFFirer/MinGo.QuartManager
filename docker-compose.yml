version: '3.8'

services:
  platform:
    build:
      context: ./src/MinGo.Qap.Platform
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__PlatformDb="Server=db;Database=PlatformDb;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      - Authentication__Type="None"
      - Heartbeat__TimeoutWarningSeconds=60
      - Heartbeat__TimeoutOfflineSeconds=90
    depends_on:
      - db
    restart: unless-stopped

  agent:
    build:
      context: ./src/MinGo.Qap.Agent
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - QAP_CLUSTER_ID="cls-001"
      - QAP_PLATFORM_URL="http://platform:5000"
      - QAP_PORT=80
      - QAP_LOG_LEVEL="Information"
    volumes:
      - ./deploy/agent/config.yaml:/app/config.yaml:ro
      - ./deploy/agent/jobs:/app/jobs:ro
    depends_on:
      - platform
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=YourStrong@Passw0rd
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data:
